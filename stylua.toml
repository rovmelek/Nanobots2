# StyLua config matching the existing code: 4 spaces, single quotes, no parentheses around string calls kept as is.
column_width = 140
line_endings = "Unix"
indent_type = "Spaces"
indent_width = 4
quote_style = "AutoPreferSingle"
call_parentheses = "Always"
collapse_simple_statement = "Never"

[sort_requires]
enabled = false
