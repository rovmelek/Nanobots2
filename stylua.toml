# StyLua config matching the existing code: 4 spaces, single quotes, call parentheses left as written (Data { ... }).
column_width = 140
line_endings = "Unix"
indent_type = "Spaces"
indent_width = 4
quote_style = "AutoPreferSingle"
call_parentheses = "Input"
collapse_simple_statement = "Never"

[sort_requires]
enabled = false
