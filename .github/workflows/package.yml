name: Package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the zip
        run: tools/package.sh "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v4
        with:
          name: Nanobots2
          path: ${{ runner.temp }}/Nanobots2_*.zip
